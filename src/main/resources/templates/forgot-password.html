<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Gauteng EMS IT Support</title>

    <link rel="stylesheet"
          href="/css/login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-page">

    <div class="background-overlay"></div>


    <!-- =====================================================
         FORGOT PASSWORD CARD
         ===================================================== -->

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo-container">

            <img
                    src="/images/gauteng-ems-logo.jpeg"
                    alt="Gauteng EMS Logo"
                    class="ems-logo">

        </div>


        <!-- TITLE -->

        <h1>GAUTENG EMS</h1>

        <h2>IT SUPPORT SYSTEM</h2>


        <!-- DIVIDER -->

        <div class="heading-line">

            <span></span>

            <i class="fa-solid fa-key"></i>

            <span></span>

        </div>


        <!-- PAGE DESCRIPTION -->

        <p class="login-description">

            Reset your password securely

        </p>


        <!-- =================================================
             RESET FORM
             ================================================= -->

        <form action="/forgot-password"
              method="post">


            <!-- CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- USERNAME / EMAIL -->

            <div class="input-group">

                <i class="fa-solid fa-user-lock"></i>

                <input
                        type="text"
                        name="usernameOrEmail"
                        placeholder="Username or Email Address"
                        autocomplete="username"
                        required>

            </div>


            <!-- INFORMATION -->

            <div class="login-hint">

                <i class="fa-solid fa-circle-info"></i>

                <span>
                    Enter the username or email address
                    associated with your EMS account.
                </span>

            </div>


            <!-- SUBMIT -->

            <button
                    type="submit"
                    class="login-button visible">

                <i class="fa-solid fa-paper-plane"></i>

                <span>
                    CONTINUE
                </span>

            </button>


        </form>


        <!-- BACK TO LOGIN -->

        <div
                class="support-message"
                style="margin-top: 20px;">

            <i class="fa-solid fa-arrow-left"></i>

            <a
                    href="/login"
                    style="color: #1ca0ff;
                           text-decoration: none;
                           font-weight: 600;">

                Back to Login

            </a>

        </div>


    </div>


    <!-- =====================================================
         BOTTOM TEXT
         ===================================================== -->

    <div class="bottom-text">

        <i class="fa-solid fa-headset"></i>

        <span>
            <strong>IT Support</strong>
        </span>

        <span>|</span>

        <span>
            Reliable. Responsive. Ready to Help.
        </span>

    </div>


</div>

</body>

</html>
