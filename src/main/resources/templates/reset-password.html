<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Gauteng EMS IT Support</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.58),
                    rgba(0, 0, 0, 0.68)
                ),
                url('/images/gauteng-ems-flag.jpeg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =====================================================
           RESET CARD
           ===================================================== */

        .reset-container {

            width: 440px;

            max-width: 92%;

            padding: 38px 40px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            border: 1px solid rgba(255, 255, 255, 0.5);

            animation: fadeIn 0.5s ease;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo {

            text-align: center;

            margin-bottom: 18px;
        }


        .logo img {

            width: 105px;

            height: 105px;

            object-fit: contain;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 5px 10px rgba(0, 0, 0, 0.25)
                );
        }


        /* =====================================================
           TITLE
           ===================================================== */

        h1 {

            margin: 5px 0 8px;

            text-align: center;

            font-size: 32px;

            font-weight: 700;

            color: #18202a;
        }


        .subtitle {

            margin: 0 0 28px;

            text-align: center;

            color: #667085;

            font-size: 15px;

            line-height: 1.5;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 700;

            color: #263238;
        }


        input[type="password"] {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d0d5dd;

            border-radius: 9px;

            background: #ffffff;

            color: #1d2939;

            font-size: 15px;

            transition: 0.2s;
        }


        input[type="password"]::placeholder {

            color: #98a2b3;
        }


        input[type="password"]:focus {

            outline: none;

            border-color: #167c3a;

            box-shadow:
                0 0 0 3px rgba(22, 124, 58, 0.12);
        }


        /* =====================================================
           RESET BUTTON
           ===================================================== */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #16803c,
                    #075d2b
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(7, 93, 43, 0.25);

            transition: all 0.2s ease;
        }


        button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 9px 20px rgba(7, 93, 43, 0.35);
        }


        button:active {

            transform: translateY(0);
        }


        /* =====================================================
           ERROR MESSAGE
           ===================================================== */

        .message {

            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }


        .error {

            background: #fff1f2;

            color: #b42318;

            border: 1px solid #fecdca;
        }


        .success {

            background: #ecfdf3;

            color: #027a48;

            border: 1px solid #abefc6;
        }


        /* =====================================================
           BACK TO LOGIN
           ===================================================== */

        .back-link {

            text-align: center;

            margin-top: 22px;
        }


        .back-link a {

            color: #075d2b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;
        }


        .back-link a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           EMS FOOTER
           ===================================================== */

        .footer-text {

            text-align: center;

            margin-top: 24px;

            color: #8a94a6;

            font-size: 11px;
        }


        /* =====================================================
           ANIMATION
           ===================================================== */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(15px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 500px) {

            .reset-container {

                padding: 30px 24px;

                border-radius: 14px;
            }

            h1 {

                font-size: 27px;
            }

            .logo img {

                width: 90px;

                height: 90px;
            }
        }

    </style>

</head>


<body>


<div class="reset-container">


    <!-- =====================================================
         GAUTENG EMS LOGO
         ===================================================== -->

    <div class="logo">

        <img
                th:src="@{/images/gauteng-ems-logo.jpeg}"
                alt="Gauteng EMS Logo">

    </div>


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <h1>
        Reset Password
    </h1>


    <p class="subtitle">

        Create a new password for your
        <strong>Gauteng EMS IT Support</strong>
        account.

    </p>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
            th:if="${error}"
            class="message error"
            th:text="${error}">
    </div>


    <!-- =====================================================
         SUCCESS
         ===================================================== -->

    <div
            th:if="${message}"
            class="message success"
            th:text="${message}">
    </div>


    <!-- =====================================================
         RESET FORM
         ===================================================== -->

    <form
            th:if="${token != null}"
            th:action="@{/reset-password}"
            method="post">


        <!-- TOKEN -->

        <input
                type="hidden"
                name="token"
                th:value="${token}">


        <!-- =================================================
             NEW PASSWORD
             ================================================= -->

        <div class="form-group">

            <label for="password">

                New Password

            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required>

        </div>


        <!-- =================================================
             CONFIRM PASSWORD
             ================================================= -->

        <div class="form-group">

            <label for="confirmPassword">

                Confirm New Password

            </label>

            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required>

        </div>


        <!-- =================================================
             BUTTON
             ================================================= -->

        <button type="submit">

            Reset Password

        </button>


    </form>


    <!-- =====================================================
         BACK TO LOGIN
         ================================================= -->

    <div class="back-link">

        <a th:href="@{/login}">

            ← Back to Login

        </a>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer-text">

        Gauteng Emergency Medical Services<br>
        IT Support Management System

    </div>


</div>


</body>

</html>
