# =========================================================
# GAUTENG EMS IT SUPPORT
# APPLICATION CONFIGURATION
# =========================================================

spring.application.name=GautengEMS_ITSupport

# =========================================================
# ACTIVE PROFILE
# =========================================================
#
# Local laptop:
#   Uses application-local.properties
#
# Online deployment:
#   Set SPRING_PROFILES_ACTIVE=prod
#
# =========================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# DATABASE
# =========================================================
#
# These values are supplied by environment variables when
# running online.
#
# They are intentionally NOT stored in GitHub.
#
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_it_support}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# EMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:gauteng.ems.itsupport@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8


# =========================================================
# SECURITY LOGGING
# =========================================================

logging.level.org.springframework.security=INFO